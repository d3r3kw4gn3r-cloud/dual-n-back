<html lang="en">

<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<title>Dual N-Back</title>
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #14141e;
    --surface2: #1e1e2e;
    --accent: #4f8ef7;
    --accent2: #2ecc71;
    --danger: #e74c3c;
    --text: #e8e8f0;
    --muted: #6b6b8a;
    --border: rgba(255,255,255,0.08);
    --cell-size: min(26vw, 110px);
    --gap: min(2vw, 8px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', system-ui, sans-serif;
    overflow: hidden;
    touch-action: manipulation;
  }
  #app {
    display: flex;
    flex-direction: column;
    height: 100dvh;
    padding: env(safe-area-inset-top, 12px) 16px env(safe-area-inset-bottom, 12px);
    gap: 8px;
  }
  #header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-top: 4px;
  }
  #title { font-size: 13px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
  #level-row { display: flex; align-items: center; gap: 8px; }
  .lvl-btn {
    width: 30px; height: 30px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text);
    font-size: 18px; line-height: 1;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s;
  }
  .lvl-btn:active { background: var(--surface); }
  .lvl-btn:disabled { opacity: 0.25; pointer-events: none; }
  #level-label { font-size: 16px; font-weight: 700; color: var(--accent); min-width: 58px; text-align: center; }
  #scores {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .score-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 8px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .score-label { font-size: 12px; color: var(--muted); font-weight: 500; letter-spacing: 0.05em; text-transform: uppercase; }
  .score-val { font-size: 20px; font-weight: 700; color: var(--text); }
  #letter-wrap { display: none; }
  #speed-row.hidden { display: none; }
  #grid-wrap {
    display: flex;
    justify-content: center;
    align-items: center;
    flex: 1;
    min-height: 0;
  }
  #grid {
    display: grid;
    grid-template-columns: repeat(3, var(--cell-size));
    grid-template-rows: repeat(3, var(--cell-size));
    gap: var(--gap);
  }
  .cell {

    height: var(--cell-size);
